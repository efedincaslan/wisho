name: Wisho
options:
  bundleIdPrefix: com.wisho
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
targets:
  Wisho:
    type: application
    platform: iOS
    sources:
      - Wisho
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wisho.app
    info:
      path: Wisho/Info.plist
      properties:
        CFBundleDisplayName: Wisho
        NSContactsUsageDescription: "Wisho reads birthdays from your contacts. Nothing ever leaves your phone."
        LSApplicationQueriesSchemes: [venmo]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Wisho/Wisho.entitlements
      properties:
        com.apple.security.application-groups: [group.com.wisho.app]
    dependencies:
      - target: WishoWidget
        embed: true
  WishoWidget:
    type: app-extension
    platform: iOS
    sources:
      - WishoWidget
      - Wisho/Models
      - Wisho/Services/BirthdayMath.swift
      - Wisho/Services/MessageTemplate.swift
      - Wisho/Support/AppConstants.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wisho.app.widget
    info:
      path: WishoWidget/Info.plist
      properties:
        CFBundleDisplayName: Wisho Birthdays
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: WishoWidget/WishoWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.wisho.app]
schemes:
  Wisho:
    build:
      targets:
        Wisho: all
    run:
      config: Debug
      storeKitConfiguration: Wisho.storekit
